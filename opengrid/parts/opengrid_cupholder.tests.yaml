# Feature tests for the openGrid cup holder.
#
# Organised by feature, not by parameter: each entry below is one thing the
# part does, the camera angle that shows it, and the parameter combinations
# that prove it works. Every case is measured (bounding box, volume, body
# count); the cases marked `render: true` are also pictured.
#
# See docs/visual-regression-tests.md for the format and how to add a feature.

version: 1
part: opengrid_cupholder.scad
description: >-
  A tapered cup holder that hangs from an openGrid facade plate, optionally
  with handle slots cut through the wall.

defaults:
  imgsize: [900, 700]
  colorscheme: Tomorrow Night
  # The cup opening points down, away from the facade, so every camera looks
  # at negative Z.
  camera:
    eye: [330, -330, -10]
    center: [0, 0, -50]
  parameters:
    # Lower than the part's own default of 150. Facet count drives render time
    # far more than it changes what a reviewer can see, and both sides of a
    # comparison use the same value, so nothing is lost by turning it down.
    Smoothing: 40

features:

  handle_slots:
    label: Handle slots
    description: >-
      Slots cut through the cup wall so a mug handle can pass through, spaced
      evenly around the circumference and measured down from the rim.
    # Mostly front-on, with the first slot rotated to face the camera so a
    # single-slot case is not hidden round the back, but swung far enough to
    # one side that the next slot round also shows — otherwise one slot and
    # three slots render to exactly the same pixels.
    camera:
      eye: [150, -420, 30]
      center: [0, 0, -55]
    parameters:
      Handle_Slot_Start_Angle: 270
    matrix:
      Handle_Slot_Count: [0, 1, 2, 3, 4, 6, 8]
    cases:
      # No slots at all: the wall must come back exactly as it was before the
      # feature existed.
      - params: {Handle_Slot_Count: 0}
        render: true
      - params: {Handle_Slot_Count: 1}
        render: true
      - params: {Handle_Slot_Count: 3}
        render: true
      # The slots nearly meet at eight; this is where the wall would break up
      # into separate pieces if the spacing were ever wrong.
      - params: {Handle_Slot_Count: 8}
        render: true
      - name: wide-slot
        params: {Handle_Slot_Count: 2, Handle_Slot_Width: 60}
        render: true
      - name: full-height-slot
        params: {Handle_Slot_Count: 2, Handle_Slot_Height: 200}
        render: true
      - name: rotated-start
        params: {Handle_Slot_Count: 2, Handle_Slot_Start_Angle: 45}

  handle_slot_ends:
    label: Handle slot end refinement
    description: >-
      How the two ends of each slot are broken — the mouth at the rim, which
      flares outward as a lead-in, and the closed inner end.
    camera:
      eye: [0, -300, -60]
      center: [0, 0, -70]
    parameters:
      Handle_Slot_Count: 1
      Handle_Slot_Start_Angle: 270
    matrix:
      Handle_Slot_End_Refinement_Type: [None, Chamfer, Fillet]
      Handle_Slot_End_Refinement_Size: [1, 3, 6]
    cases:
      - params: {Handle_Slot_End_Refinement_Type: None, Handle_Slot_End_Refinement_Size: 3}
        render: true
      - params: {Handle_Slot_End_Refinement_Type: Chamfer, Handle_Slot_End_Refinement_Size: 6}
        render: true
      - params: {Handle_Slot_End_Refinement_Type: Fillet, Handle_Slot_End_Refinement_Size: 6}
        render: true
      # The refinement is clamped so the two ends can never overrun each other.
      # This case asks for far more than the slot can give.
      - name: oversized-refinement
        params:
          Handle_Slot_End_Refinement_Type: Fillet
          Handle_Slot_End_Refinement_Size: 20
          Handle_Slot_Width: 12
        render: true

  snap_placement:
    label: Snap placement
    description: >-
      Which openGrid snaps the facade plate carries, and whether they are full
      or lite height.
    camera:
      eye: [240, -240, 330]
      center: [0, 0, -15]
    matrix:
      Snap_Placement: [All, Edges, Corners]
      Grid_Type: [Full, Lite]
    cases:
      - params: {Snap_Placement: Corners, Grid_Type: Lite}
        render: true
      - params: {Snap_Placement: Edges, Grid_Type: Lite}
        render: true
      - params: {Snap_Placement: All, Grid_Type: Full}
        render: true

  corner_refinement:
    label: Plate corner refinement
    description: >-
      The fillet or chamfer applied to the vertical corners of the facade
      plate.
    # Close in on one corner: at plate scale a 5 mm fillet is a few pixels.
    camera:
      eye: [-115, -115, 45]
      center: [-56, -56, -2]
    matrix:
      Corner_Refinement_Type: [None, Chamfer, Fillet]
      Corner_Refinement_Size: [2, 5, 10]
    cases:
      - params: {Corner_Refinement_Type: None, Corner_Refinement_Size: 5}
        render: true
      - params: {Corner_Refinement_Type: Chamfer, Corner_Refinement_Size: 10}
        render: true
      - params: {Corner_Refinement_Type: Fillet, Corner_Refinement_Size: 10}
        render: true

  cup_profile:
    label: Cup body profile
    description: >-
      The tapered body itself — the two diameters, the height, the wall
      thickness, and how many grid units the plate grows to cover.
    camera:
      eye: [330, -330, -10]
      center: [0, 0, -50]
    matrix:
      Cup_Holder_Top_Diameter: [70, 90, 120]
      Cup_Holder_Height: [50, 90]
    cases:
      - params: {Cup_Holder_Top_Diameter: 90, Cup_Holder_Height: 90}
        render: true
      - name: tall-and-narrow
        params: {Cup_Holder_Top_Diameter: 65, Cup_Holder_Bottom_Diameter: 60, Cup_Holder_Height: 130}
        render: true
      - name: thick-wall
        params: {Wall_Thickness: 5}
        render: true
      # The plate is sized from the top diameter unless this is switched on,
      # which changes the grid unit count and so the whole plate.
      - name: sized-to-bottom
        params: {Size_Base_Units_To_Bottom_Diameter: true}
        render: true
